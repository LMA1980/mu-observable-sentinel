[package]
name = "mu-observable-sentinel"
version = "0.1.0"
edition = "2021"
description = "Sandboxed host infrastructure and kernel telemetry sentinel daemon bridging /dev/kmsg, PSI, block I/O latency, Btrfs device error counters, and systemd journal socket pressure into MuObserve-collector"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/mu-observable-sentinel"

[dependencies]
mu-observable-ipc = { git = "https://github.com/LMA1980/mu-observable-ipc.git", branch = "feat/m8-naming-alignment" }
mu-ci-isolation = { git = "https://github.com/LMA1980/mu-ci-isolation.git", branch = "feat/m8-naming-alignment" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
